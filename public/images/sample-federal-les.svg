<text x="28" y="414" class="body">Night differential</text><text x="560" y="414" class="body">12</text><text x="850" y="414" class="body">$115</text>
<text x="28" y="449" class="body">Annual leave paid</text><text x="560" y="449" class="body">8</text><text x="850" y="449" class="body">$382</text>
<line x1="20" y1="461" x2="980" y2="461" class="line"/>
