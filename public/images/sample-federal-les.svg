<text x="28" y="939" class="body">Sick leave</text><text x="355" y="939" class="body">4</text><text x="580" y="939" class="body">0</text><text x="805" y="939" class="body">276</text>
<line x1="2" y1="955" x2="998" y2="955" class="heavy"/>
<rect x="2" y="956" width="996" height="35" fill="#f1f3f0"/><text x="25" y="981" class="section">BENEFITS PAID BY AGENCY (NOT NET PAY)</text>
<text x="28" y="1020" class="body">Retirement / TSP</text><text x="390" y="1020" class="body">$315</text><text x="540" y="1020" class="body">Health / payroll tax share</text><text x="970" y="1020" class="body" text-anchor="end">$724</text>
<line x1="2" y1="1043" x2="998" y2="1043" class="heavy"/>
<rect x="2" y="1044" width="996" height="35" fill="#f1f3f0"/><text x="25" y="1069" class="section">REMARKS</text>
<text x="28" y="1108" class="body">Review current TSP election and any personnel or payroll adjustments.</text>
<text x="28" y="1140" class="small muted">All figures and dates are fictional; section names vary by payroll provider.</text>
</svg>
