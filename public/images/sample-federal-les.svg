<line x1="2" y1="811" x2="998" y2="811" class="heavy"/>
<rect x="2" y="812" width="996" height="35" fill="#f1f3f0"/><text x="25" y="837" class="section">LEAVE BALANCES (HOURS)</text>
<text x="28" y="873" class="head">TYPE</text><text x="340" y="873" class="head">ACCRUED</text><text x="565" y="873" class="head">USED</text><text x="790" y="873" class="head">BALANCE</text>
