<text x="28" y="216" class="small muted">PAY PLAN / GRADE / STEP</text><text x="290" y="216" class="body">GS / 12 / 04</text>
<text x="580" y="216" class="small muted">LEAVE SCD</text><text x="715" y="216" class="body">05/12/2012</text>
<text x="28" y="248" class="small muted">ADJUSTED ANNUAL SALARY</text><text x="290" y="248" class="body">$99,320</text>
<line x1="2" y1="276" x2="998" y2="276" class="heavy"/>
<rect x="2" y="277" width="996" height="35" fill="#f1f3f0"/><text x="25" y="302" class="section">EARNINGS</text>
<text x="25" y="338" class="head">DESCRIPTION</text><text x="500" y="338" class="head">HOURS THIS PERIOD</text><text x="760" y="338" class="head">AMOUNT THIS PERIOD</text>
<line x1="20" y1="348" x2="980" y2="348" class="line"/>
