<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1160" role="img" aria-labelledby="title desc">
<title id="title">Illustrative federal civilian Leave and Earnings Statement</title>
<desc id="desc">Fictional sample showing employee and pay period, earnings, deductions, net pay, leave, agency contributions, and remarks. All names, amounts, and identifiers are examples.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d2b29}.small{font-size:15px}.body{font-size:19px}.head{font-size:18px;font-weight:700}.title{font-size:27px;font-weight:700}.section{font-size:18px;font-weight:700;letter-spacing:1px}.muted{fill:#56615d}.line{stroke:#87918b;stroke-width:1.4}.heavy{stroke:#263c34;stroke-width:2.5}</style>
<rect x="1" y="1" width="998" height="1158" fill="#fff" stroke="#263c34" stroke-width="2"/>
<rect x="2" y="2" width="996" height="86" fill="#e9eee8"/>
<text x="30" y="40" class="title">LEAVE AND EARNINGS STATEMENT</text>
<text x="30" y="67" class="small muted">ILLUSTRATIVE SAMPLE • FEDERAL CIVILIAN PAY • NOT AN OFFICIAL RECORD</text>
<text x="785" y="43" class="head">PAY PERIOD 18</text>
<text x="785" y="68" class="small">PAY DATE 09/18/2026</text>
<line x1="2" y1="88" x2="998" y2="88" class="heavy"/>
