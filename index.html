<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="LIBzZzI0M6w8D-0UsMG58OTLeMWpZWVAN3pKyvl9k1w" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A1A18" />

    <!-- Fallback title — React Helmet overrides this -->
    <title>Broussard Financial Services | San Diego, CA</title>

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://assets.calendly.com https://widgets.leadconnectorhq.com https://services.leadconnectorhq.com https://stcdn.leadconnectorhq.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com https://stcdn.leadconnectorhq.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://calendly.com https://widgets.leadconnectorhq.com https://services.leadconnectorhq.com; frame-src https://calendly.com https://widgets.leadconnectorhq.com;"
    />
  </head>
  <body>
    <!--
      Hidden form for Netlify build-time detection so the React form
      submissions can be processed. Notification delivery must be configured
      and verified in the hosting dashboard.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="honeypot" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="topic" />
      <textarea name="message"></textarea>
      <input type="text" name="honeypot" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
